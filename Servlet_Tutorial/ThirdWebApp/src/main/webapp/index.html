<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Registration</title>

<!--  dynamic website-->

  <style>

    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:'Segoe UI',sans-serif;
    }

    body{
        min-height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background:linear-gradient(135deg,#667eea,#764ba2);
    }

    .form-container{
        width:420px;
        background:white;
        padding:40px;
        border-radius:20px;
        box-shadow:0 20px 40px rgba(0,0,0,0.2);
    }

    .form-container h1{
        text-align:center;
        color:#333;
        margin-bottom:30px;
    }

    .form-group{
        margin-bottom:20px;
    }

    .form-group label{
        display:block;
        margin-bottom:8px;
        font-weight:600;
        color:#444;
    }

    .form-group input{
        width:100%;
        padding:14px;
        border:2px solid #ddd;
        border-radius:10px;
        font-size:16px;
        transition:0.3s;
    }

    .form-group input:focus{
        outline:none;
        border-color:#667eea;
        box-shadow:0 0 10px rgba(102,126,234,0.3);
    }

    .signup-btn{
        width:100%;
        padding:15px;
        border:none;
        border-radius:10px;
        background:#667eea;
        color:white;
        font-size:17px;
        font-weight:bold;
        cursor:pointer;
        transition:0.3s;
    }

    .signup-btn:hover{
        background:#5563d6;
        transform:translateY(-2px);
    }

    .info{
        text-align:center;
        margin-top:20px;
        color:#777;
        font-size:14px;
    }

  </style>

</head>
<body>

<div class="form-container">

  <h1>Create Account</h1>

  <form action="./Servlet" method="post">

    <div class="form-group">
      <label>User Name</label>
      <input
              type="text"
              name="username"
              placeholder="Enter your name"
              required>
    </div>

    <div class="form-group">
      <label>User City</label>
      <input
              type="text"
              name="city"
              placeholder="Enter your city"
              required>
    </div>

    <button class="signup-btn" type="submit">
      Signup
    </button>

  </form>

  <div class="info">
    Welcome to our registration portal
  </div>

</div>

</body>
</html>
