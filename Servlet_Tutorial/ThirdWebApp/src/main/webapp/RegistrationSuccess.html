<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Successful</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#667eea,#764ba2);
            overflow:hidden;
        }

        .background-blur{
            position:absolute;
            width:300px;
            height:300px;
            border-radius:50%;
            background:rgba(255,255,255,0.15);
            filter:blur(80px);
        }

        .blur1{
            top:-80px;
            left:-80px;
        }

        .blur2{
            bottom:-80px;
            right:-80px;
        }

        .success-card{
            position:relative;
            width:420px;
            padding:40px 35px;
            background:rgba(255,255,255,0.12);
            backdrop-filter:blur(18px);
            border:1px solid rgba(255,255,255,0.2);
            border-radius:25px;
            text-align:center;
            color:white;
            box-shadow:0 20px 40px rgba(0,0,0,0.25);
            animation:slideUp 0.8s ease;
        }

        @keyframes slideUp{
            from{
                opacity:0;
                transform:translateY(40px);
            }
            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        .checkmark{
            width:90px;
            height:90px;
            margin:0 auto 25px;
            border-radius:50%;
            background:linear-gradient(135deg,#00c853,#69f0ae);
            display:flex;
            justify-content:center;
            align-items:center;
            font-size:42px;
            font-weight:bold;
            box-shadow:0 10px 25px rgba(0,200,83,0.4);
        }

        h1{
            font-size:2rem;
            margin-bottom:10px;
        }

        p{
            color:rgba(255,255,255,0.85);
            line-height:1.6;
            margin-bottom:30px;
        }

        .btn{
            display:inline-block;
            text-decoration:none;
            padding:14px 30px;
            border-radius:12px;
            background:white;
            color:#6a11cb;
            font-weight:600;
            transition:all 0.3s ease;
        }

        .btn:hover{
            transform:translateY(-3px);
            box-shadow:0 10px 20px rgba(255,255,255,0.25);
        }

        .info{
            margin-top:20px;
            font-size:0.9rem;
            color:rgba(255,255,255,0.75);
        }
    </style>
</head>
<body>

<div class="background-blur blur1"></div>
<div class="background-blur blur2"></div>

<div class="success-card">

    <div class="checkmark">✓</div>

    <h1>Registration Successful!</h1>

    <p>
        Your account has been created successfully.
        You can now log in and start using all available features.
    </p>

    <a href="login.html" class="btn">Go to Login</a>

    <div class="info">
        Thank you for joining us 🚀
    </div>

</div>

</body>
</html>
