<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration</title>

  <style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body{
        min-height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background:linear-gradient(
                135deg,
                #f7f1e8,
                #ece8e1,
                #d9d9d9
        );
        padding:20px;
    }

    .register-card{
        width:420px;
        background:rgba(255,255,255,0.75);
        backdrop-filter:blur(15px);
        border:1px solid rgba(255,255,255,0.4);
        border-radius:24px;
        padding:40px;
        box-shadow:
                0 15px 35px rgba(0,0,0,0.12),
                0 5px 15px rgba(0,0,0,0.08);
    }

    .register-card h1{
        text-align:center;
        color:#444;
        margin-bottom:8px;
        font-size:2rem;
    }

    .subtitle{
        text-align:center;
        color:#777;
        margin-bottom:30px;
        font-size:0.95rem;
    }

    .input-group{
        margin-bottom:18px;
    }

    .input-group label{
        display:block;
        margin-bottom:8px;
        color:#555;
        font-weight:600;
    }

    .input-group input{
        width:100%;
        padding:14px 16px;
        border:none;
        outline:none;
        border-radius:12px;
        background:#f5f3ef;
        color:#333;
        font-size:1rem;
        transition:0.3s;
    }

    .input-group input:focus{
        background:white;
        box-shadow:0 0 0 3px rgba(170,170,170,0.25);
    }

    .signup-btn{
        width:100%;
        padding:15px;
        border:none;
        border-radius:12px;
        cursor:pointer;
        font-size:1rem;
        font-weight:600;
        color:white;
        background:linear-gradient(
                135deg,
                #6e6e6e,
                #4f4f4f
        );
        transition:0.3s;
        margin-top:10px;
    }

    .signup-btn:hover{
        transform:translateY(-2px);
        box-shadow:0 8px 20px rgba(0,0,0,0.18);
    }

    .footer-text{
        text-align:center;
        margin-top:20px;
        color:#666;
        font-size:0.9rem;
    }

    .footer-text a{
        color:#4f4f4f;
        text-decoration:none;
        font-weight:600;
    }
  </style>
</head>
<body>

<div class="register-card">

  <h1>Create Account</h1>
  <p class="subtitle">Join us and start your journey today</p>

  <form action="Register" method="post">

    <div class="input-group">
      <label>Name</label>
      <input type="text"
             name="name"
             placeholder="Enter your full name"
             required>
    </div>

    <div class="input-group">
      <label>Email</label>
      <input type="email"
             name="email"
             placeholder="Enter your email"
             required>
    </div>

    <div class="input-group">
      <label>Password</label>
      <input type="password"
             name="password"
             placeholder="Create password"
             required>
    </div>

    <div class="input-group">
      <label>City</label>
      <input type="text"
             name="city"
             placeholder="Enter your city"
             required>
    </div>

    <button type="submit" class="signup-btn">
      Sign Up
    </button>

  </form>

  <p class="footer-text">
    Already have an account?
    <a href="#">Login</a>
  </p>

</div>

</body>
</html>
